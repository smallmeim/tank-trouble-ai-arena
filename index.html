<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>坦克回廊 · AI 代码小车混战版</title>
  <link rel="icon" href="./assets/icon.ico" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #e8e8ec;
      overflow: hidden;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      user-select: none;
    }
    #app {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-canvas {
      background: #e8e8ec;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.12);
    }

    .hidden {
      display: none !important;
    }

    /* 顶部 AI 代码小车悬浮工具栏 */
    #py-arena-ui {
      position: fixed;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .py-bar {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: rgba(17, 24, 39, 0.90);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.22);
      color: #f8fafc;
      font-size: 12px;
      white-space: nowrap;
    }
    .py-brand {
      font-weight: 700;
      color: #38bdf8;
      padding: 0 6px 0 2px;
      letter-spacing: 0.3px;
    }
    .py-btn {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.08);
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 999px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.1s;
    }
    .py-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.32);
    }
    .py-btn:active {
      transform: scale(0.97);
    }
    .py-btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #2563eb);
      border-color: rgba(56, 189, 248, 0.6);
      color: #ffffff;
    }
    .py-btn-primary:hover {
      background: linear-gradient(135deg, #38bdf8, #3b82f6);
    }
    .py-btn-accent {
      background: rgba(245, 158, 11, 0.2);
      border-color: rgba(245, 158, 11, 0.5);
      color: #fde68a;
    }
    .py-btn-accent:hover {
      background: rgba(245, 158, 11, 0.32);
    }
    #py-bot-err {
      font-size: 11px;
      color: #94a3b8;
      padding-left: 4px;
      max-width: 210px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* 选车配比抽屉 */
    #py-drawer {
      pointer-events: auto;
      width: 440px;
      max-width: 92vw;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(17, 24, 39, 0.94);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
      color: #e2e8f0;
      font-size: 13px;
    }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .drawer-head label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      color: #f8fafc;
    }
    #py-tank-count,
    .slot-select {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      outline: none;
    }
    .drawer-tip {
      font-size: 11px;
      color: #94a3b8;
    }
    #py-slots-wrap {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slot-row {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(30, 41, 59, 0.65);
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    .slot-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.2);
    }
    .slot-title {
      width: 48px;
      font-weight: 600;
      color: #cbd5e1;
      flex-shrink: 0;
    }
    .slot-select {
      flex: 1;
      min-width: 0;
    }
    .drawer-foot {
      margin-top: 10px;
      font-size: 11px;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Prompt 弹窗 */
    #py-prompt-modal {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .prompt-card {
      width: 720px;
      max-width: 96vw;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #0f172a;
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }
    .prompt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .prompt-header h3 {
      font-size: 15px;
      color: #38bdf8;
    }
    #py-prompt-text {
      width: 100%;
      height: 420px;
      max-height: 58vh;
      background: #020617;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: Consolas, "Courier New", monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: vertical;
      user-select: text;
    }
    .prompt-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
    }
    #py-copy-msg {
      margin-right: auto;
      font-size: 12px;
      color: #34d399;
    }
  </style>
</head>
<body>
  <div id="py-arena-ui">
    <div class="py-bar">
      <span class="py-brand">AI 代码混战</span>
      <button id="py-toggle-drawer" class="py-btn" type="button">配置小车</button>
      <button id="py-start-btn" class="py-btn py-btn-primary" type="button">▶ 立即开战</button>
      <button id="py-reload-btn" class="py-btn" type="button">🔄 刷新 bots/</button>
      <button id="py-open-dir-btn" class="py-btn" type="button">打开 bots 文件夹</button>
      <button id="py-prompt-btn" class="py-btn py-btn-accent" type="button">复制 AI 写车提示词</button>
      <span id="py-bot-err">正在扫描 bots/...</span>
    </div>

    <div id="py-drawer">
      <div class="drawer-head">
        <label>
          参战小车数量:
          <select id="py-tank-count">
            <option value="2">2 辆</option>
            <option value="3">3 辆</option>
            <option value="4" selected>4 辆</option>
            <option value="5">5 辆</option>
            <option value="6">6 辆</option>
          </select>
        </label>
        <span class="drawer-tip">支持给每辆车分别选不同 .py</span>
      </div>
      <div id="py-slots-wrap"></div>
      <div class="drawer-foot">
        把其他 AI 生成的 <code>.py</code> 放进 <code>bots/</code> 目录，点「🔄 刷新 bots/」即可选给任意小车，也可混入人类手操(WASD/方向键)下场同台竞技。
      </div>
    </div>
  </div>

  <div id="py-prompt-modal" class="hidden">
    <div class="prompt-card">
      <div class="prompt-header">
        <h3>复制给其他 AI 的写车提示词（直接出可用的 bots/*.py）</h3>
        <button id="py-close-prompt" class="py-btn" type="button">关闭</button>
      </div>
      <textarea id="py-prompt-text" readonly></textarea>
      <div class="prompt-actions">
        <span id="py-copy-msg"></span>
        <button id="py-copy-prompt" class="py-btn py-btn-primary" type="button">一键复制提示词</button>
      </div>
    </div>
  </div>

  <div id="app">
    <canvas id="game-canvas" width="960" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
